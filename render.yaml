services:
  - type: web
    name: gabook-auto-downloader
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: KINDLE_EMAIL
        sync: false
      - key: KINDLE_EMAIL_PAPA
        sync: false
      - key: KINDLE_EMAIL_GONZALO
        sync: false
      - key: KINDLE_EMAIL_GABRIEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
